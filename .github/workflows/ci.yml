name: CI Pipeline

on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Run Pytest
        run: |
          python -m pytest core/tests/

  nextjs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint Next.js Project
        run: npm run lint

      - name: Build Next.js Project
        run: npm run build
        env:
          # Задаем фейковые переменные окружения, чтобы этап сборки Next.js не падал из-за валидации при импорте в lib/supabase.ts
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "mock-key"
          QUEUE_SECRET_TOKEN: "mock-secret"
